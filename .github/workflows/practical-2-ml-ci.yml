name: Student Placement - Practical 2 ML CI

on:
  push:
    branches:
      - main
    paths:
      - 'Practical-2/**'
      - 'Practical-3/**'
      - '.github/workflows/practical-2-ml-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'Practical-2/**'
      - 'Practical-3/**'
      - '.github/workflows/practical-2-ml-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r Practical-2/requirements.txt

      - name: Train Student Placement model
        working-directory: Practical-2
        run: python train_model.py

      - name: Check ML quality gate
        run: python Practical-3/quality_gate.py

      - name: Run automated ML tests
        working-directory: Practical-2
        run: python -m unittest test_ml_pipeline.py -v

name: Student Placement - Practical 1 CI

on:
  push:
    branches:
      - main
    paths:
      - 'Practical-1/**'
      - '.github/workflows/practical-1-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'Practical-1/**'
      - '.github/workflows/practical-1-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run automated tests
        run: python -m unittest discover -s Practical-1 -p "test_*.py" -v
